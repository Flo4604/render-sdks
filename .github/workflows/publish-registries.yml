name: Publish SDKs to package registries
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing SDK release tag, for example v0.1.0
        required: true
        type: string
      npm:
        description: Publish to npm after configuring trusted publishing
        type: boolean
        default: false
      pypi:
        description: Publish to PyPI after configuring trusted publishing
        type: boolean
        default: false
concurrency:
  group: sdk-registries-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  npm:
    if: github.event_name == 'release' || inputs.npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download and verify public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event.release.tag_name || inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$RELEASE" --repo "$REPOSITORY" --pattern '*.tgz' --pattern SHA256SUMS
          sha256sum --ignore-missing --check SHA256SUMS
      - run: npm publish ./*.tgz --access public
  pypi:
    if: github.event_name == 'release' || inputs.pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download and verify public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event.release.tag_name || inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir dist
          cd dist
          gh release download "$RELEASE" --repo "$REPOSITORY" --pattern '*.whl' --pattern SHA256SUMS
          sha256sum --ignore-missing --check SHA256SUMS
          rm SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
