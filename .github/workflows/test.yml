name: Test SDKs
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm pack --ignore-scripts
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/web/package-lock.json
      - run: npm ci
      - run: npm run check:scripts
      - run: npm test
      - run: npm run size
      - run: npm run test:browser
      - run: npm run pack:check
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.11"
      - run: uv run --locked --extra dev pytest
      - run: uv build --wheel
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: sdks/go/go.mod
          cache: false
      - run: go test -race ./...
  csharp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/csharp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet run --project tests/Medalbot.Render.Tests.csproj -c Release
      - run: dotnet pack src/Medalbot.Render.csproj -c Release
